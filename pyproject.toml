[build-system]
requires = ["setuptools>=69.0"]
build-backend = "setuptools.build_meta"

[project]
name = "actentra"
version = "0.1.0a0"
description = "Lightweight, local-first deterministic execution boundary for AI agents."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.12"
dependencies = [
    "PyYAML>=6.0,<7.0",
    "cryptography>=43.0",
    "typer>=0.12,<1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "hypothesis>=6.100",
    "jsonschema>=4.20",
    "mypy>=1.10",
    "ruff>=0.6",
    "psutil>=6.0",
    "types-PyYAML>=6.0",
]

[project.scripts]
actentra = "actentra_cli.main:app"

[tool.setuptools.packages.find]
where = ["core", "executors", "gateway", "sdk/python", "cli"]
include = [
    "actentra_core*",
    "actentra_executors*",
    "actentra_gateway*",
    "actentra*",
    "actentra_cli*",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["core", "executors", "gateway", "sdk/python", "cli"]
markers = [
    "slow: slow, fuzz, or resource-heavy tests (excluded from default fast loop)",
]
addopts = "-q -m 'not slow'"

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["core", "executors", "gateway", "sdk/python", "cli", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "S"]
ignore = [
    "S101", # assert is used in tests
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101", "S108", "S310"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = ["core", "executors", "gateway", "sdk/python", "cli"]
packages = [
    "actentra_core",
    "actentra_executors",
    "actentra_gateway",
    "actentra",
    "actentra_cli",
]
warn_unused_configs = true
